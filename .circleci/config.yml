# Python CircleCI 2.1 configuration file
version: 2.1
jobs:
  build:
    docker:
      - image: cimg/python:3.7

    working_directory: ~/repo

    steps:
      # Step 1: obtenemos codigo fuente
      - checkout
      # Step 2: creamos venv e instalamos dependencias
      - run:
          name: install dependencies
          command: |
            python3 -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt
      # Step 3: ejecutamos linters y flake8 y lanzamos casos de prueba
      - run:
          name: run tests
          command: |
            source venv/bin/activate
            flake8 --exclude=venv* --statistics
            pytest -v
      # Step 4: ejecutamos controles de calidad de codigo
      - run:
          name: run code quality checks
          command: |
            source venv/bin/activate
            black --check --exclude=venv .
            mypy --exclude venv .
            vulture saludar.py
      # Step 5: ejecutamos analisis de seguridad estatico (SAST)
      - run:
          name: run SAST
          command: |
            source venv/bin/activate
            bandit -r . -x ./venv,./test_saludar.py
#      - setup_remote_docker:
#          docker_layer_caching: true
      # Step 6: Docker build
      - run:
          name: Build and Push Docker
          command: |
            source venv/bin/activate
            #docker build -t poc/$IMAGE_NAME:$TAG .
            #echo $DOCKER_PWD | docker login -u $DOCKER_LOGIN --password-stdin
            #docker push ideaslocas/$IMAGE_NAME:$TAG

workflows:
  build_and_test:
    jobs:
      - build
